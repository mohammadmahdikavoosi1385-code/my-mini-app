<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark" data-accent="white">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23000%27/%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2726%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%2710%27/%3E%3C/svg%3E">
<title>ChatGPT</title>
<style>
/* =====================================================
   Tokens
===================================================== */
:root{
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Arabic","Noto Naskh Arabic","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --link:#7aa8ff;--blue:#4285f4;--danger:#ff6b6b;
}
[data-theme="dark"]{
  --bg:#000;--fg:#fff;--fg2:#d4d4d4;--muted:#9c9c9c;
  --card:#414141;--card2:#4e4e4e;--circle:#303030;--circle-b:#3f3f3f;
  --pop:#303030;--pop-b:#3f3f3f;--composer:#303030;--bubble:#414141;
  --code:#303030;--code-b:#303030;--seg:#414141;--seg-on:#212121;--hover:#1a1a1a;--line:#262626;
  --pill-bg:#3f484f;--pill-fg:#51a7f2;
  --scrim:rgba(0,0,0,.4);--shadow:0 12px 40px rgba(0,0,0,.65);
  --sw-off-bg:#2b2b2b;--sw-off-bd:#8c8c8c;--sw-off-k:#8c8c8c;--sw-on-k:#1d1d1d;
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#fff;--fg:#0d0d0d;--fg2:#3b3b3b;--muted:#6f6f6f;
  --card:#efefef;--card2:#e2e2e2;--circle:#f3f3f3;--circle-b:#e1e1e1;
  --pop:#fff;--pop-b:#e3e3e3;--composer:#f1f1f1;--bubble:#efefef;
  --code:#f5f5f5;--code-b:#f5f5f5;--seg:#e6e6e6;--seg-on:#fff;--hover:#f3f3f3;--line:#e6e6e6;
  --pill-bg:#e4effe;--pill-fg:#1a73e8;
  --scrim:rgba(0,0,0,.35);--shadow:0 12px 40px rgba(0,0,0,.18);
  --sw-off-bg:#f3f3f3;--sw-off-bd:#7a7a7a;--sw-off-k:#7a7a7a;--sw-on-k:#fff;
  --link:#1a5fd8;color-scheme:light;
}
[data-accent="blue"]{--accent:#3e82ef;--on-accent:#fff;--newchat:#3e82ef;--bub-d:#1d3a6b;--bub-l:#dbe7fd}
[data-accent="green"]{--accent:#43b05a;--on-accent:#fff;--newchat:#43b05a;--bub-d:#1e4e28;--bub-l:#dcf0e0}
[data-accent="yellow"]{--accent:#fcc934;--on-accent:#1a1a1a;--newchat:#fcc934;--bub-d:#6f5817;--bub-l:#fdf1cc}
[data-accent="pink"]{--accent:#f0709f;--on-accent:#fff;--newchat:#f0709f;--bub-d:#6a3146;--bub-l:#fbe0ea}
[data-accent="orange"]{--accent:#f58234;--on-accent:#fff;--newchat:#f58234;--bub-d:#6b3a1d;--bub-l:#fde6d4}
[data-accent="purple"]{--accent:#a07cf2;--on-accent:#fff;--newchat:#a07cf2;--bub-d:#46376b;--bub-l:#e8e0fb}
[data-accent="white"]{--accent:#fff;--on-accent:#111;--newchat:#3e82ef;--on-newchat:#fff}
[data-theme="light"][data-accent="white"]{--accent:#0d0d0d;--on-accent:#fff;--on-newchat:#fff}
[data-theme="dark"]{--bubble-a:var(--bub-d,#414141);--tk-t:#d0376f;--tk-a:#83a73c;--tk-s:#aad54f;--tk-k:#77cddd;--tk-f:#dfd687;--tk-n:#d9a05b;--tk-c:#8a8a8a;--code-fg:#f8f9f4}
[data-theme="light"]{--bubble-a:var(--bub-l,#efefef);--tk-t:#b3124f;--tk-a:#587400;--tk-s:#2b7a1e;--tk-k:#0a6a85;--tk-f:#8a5a00;--tk-n:#a04a00;--tk-c:#6a6a6a;--code-fg:#1f2328}

/* =====================================================
   Base
===================================================== */
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.sel-ok,.sel-ok *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
body{font-family:var(--font);color:var(--fg);font-size:16px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;line-height:1.25}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
::selection{background:var(--accent);color:var(--on-accent)}
.theme-anim,.theme-anim *{transition:background-color .3s,color .3s,border-color .3s !important}

/* =====================================================
   Shell + header
===================================================== */
.app{position:relative;height:100vh;height:100dvh;max-width:720px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 6px;flex:none;position:relative;z-index:5}
.top .grow{flex:1;text-align:center;color:var(--fg2);font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.circle{width:44px;height:44px;border-radius:50%;border:0;background:var(--circle);color:var(--fg);display:grid;place-items:center;flex:none;padding:0;transition:transform .12s,opacity .15s}
.circle:active{transform:scale(.93)}
.circle.dim{opacity:.45;pointer-events:none}
.pill2{height:44px;border-radius:22px;border:0;background:var(--circle);display:flex;align-items:center;flex:none;direction:ltr}
.pill2 button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;border-radius:22px;padding:0}
.pill2 button:active{opacity:.6}
.view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;overscroll-behavior:contain}
.plus-pill{height:44px;padding:0 16px 0 14px;border-radius:22px;border:0;background:var(--pill-bg);color:var(--pill-fg);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;line-height:1.2;flex:none;transition:transform .12s}
.plus-pill:active{transform:scale(.96)}
.plus-pill b{font-weight:700;direction:ltr}
.circle.on{background:var(--card)}
.ti{display:block;flex:none}
.ai-atts{justify-content:flex-start;max-width:100%;margin-bottom:8px}
.ai-atts .att-img{width:min(100%,340px);height:auto;aspect-ratio:1;border-radius:22px}
.popup{max-height:70vh;overflow:auto}
[dir=ltr] .drawer{transform:translateX(-100%)}
[dir=ltr] .app.dr-open .drawer{transform:none}
[dir=ltr] .scr-btn .ti,[dir=ltr] .r-ch .ti{transform:scaleX(-1)}
.down-btn{position:absolute;inset-inline:0;margin:auto;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--circle);display:grid;place-items:center;z-index:6;box-shadow:0 4px 18px rgba(0,0,0,.4);transition:opacity .15s,transform .15s}
.down-btn.hide{opacity:0;pointer-events:none;transform:translateY(8px)}

/* =====================================================
   Empty state
===================================================== */
.empty{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 26px 14px;animation:fade .35s ease both}
.temp-note{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.temp-note h2{margin:8px 0 0;font-size:20px;color:var(--fg)}
.temp-note p{margin:0}
.sugg{display:flex;flex-direction:column}
.sugg button{display:flex;align-items:center;gap:14px;height:50px;border:0;background:none;color:var(--fg2);font-size:17px;text-align:start;border-radius:12px}
.sugg button:active{opacity:.6}

/* =====================================================
   Thread
===================================================== */
.thread{width:100%;padding:8px 16px 26px;display:flex;flex-direction:column;gap:22px}
.msg{animation:msgIn .3s var(--ease) both}
.msg.user{display:flex;flex-direction:column;align-items:flex-end;gap:6px;position:relative}
.bubble-wrap{position:relative;max-width:86%;display:flex;flex-direction:column;align-items:center}
.bubble-wrap.has-react{margin-bottom:12px}
.bubble-react{position:absolute;bottom:-14px;inset-inline:0;margin:auto;width:32px;height:32px;border-radius:50%;background:var(--bubble-a);border:2px solid var(--bg);display:grid;place-items:center;font-size:16px;line-height:1}
.bubble{max-width:100%;background:var(--bubble-a);padding:9px 17px;border-radius:24px;white-space:pre-wrap;overflow-wrap:anywhere}
.atts{display:flex;flex-wrap:wrap;gap:6px;max-width:86%;justify-content:flex-end}
.att-img{width:120px;height:120px;object-fit:cover;border-radius:18px}
.att-file{display:flex;align-items:center;gap:6px;background:var(--bubble);border-radius:16px;padding:7px 13px;font-size:14px;max-width:100%}
.att-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions{display:flex;align-items:center;margin-top:6px;margin-inline-start:-8px}
.msg.streaming .actions{display:none}
.msg.user.editing{align-items:stretch}
.edit-box{background:var(--bubble);border-radius:24px;padding:12px 14px}
.edit-box textarea{width:100%;border:0;outline:0;background:none;resize:none;min-height:56px;font-size:16px;line-height:1.6}
.edit-box .row-b{display:flex;gap:8px;justify-content:flex-start;margin-top:8px}
.edit-box button{height:38px;padding:0 18px;border-radius:19px;border:0;font-size:14.5px;background:var(--card2)}
.edit-box button.go{background:var(--accent);color:var(--on-accent);font-weight:600}
.act{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--fg2);display:grid;place-items:center;transition:background .15s,color .15s;padding:0}
.act:active{background:var(--hover)}
.act.on{color:var(--fg)}

.dots{display:flex;gap:5px;align-items:center;height:30px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.thinking{color:var(--muted);display:flex;align-items:center;gap:10px}

/* markdown */
.md{overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 12px}
.md h2,.md h3,.md h4,.md h5{font-weight:600;line-height:1.5;margin:20px 0 8px}
.md h2{font-size:1.35em}.md h3{font-size:1.18em}.md h4{font-size:1.06em}.md h5{font-size:1em}
.md ul,.md ol{margin:0 0 12px;padding-inline-start:24px}
.md li{margin:3px 0}
.md blockquote{margin:0 0 12px;padding-inline-start:14px;border-inline-start:3px solid var(--card2);color:var(--fg2)}
.md hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.md a{color:var(--link);text-decoration:underline;text-underline-offset:3px}
.md code{font-family:var(--mono);font-size:.92em;background:var(--bubble);padding:2px 6px;border-radius:6px;direction:ltr;unicode-bidi:isolate}
.table-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:14px}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th,.md td{padding:8px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.md th{font-weight:600;background:var(--bubble)}
.md tr:last-child td{border-bottom:0}

/* code block (run | code segmented control, copy, language, select) */
.codeblock{direction:ltr;background:var(--code);border-radius:28px;margin:14px 0;overflow:hidden;text-align:left}
.cb-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 0 10px}
.cb-tools{display:flex;align-items:center;gap:10px}
.cb-seg{display:flex;align-items:center;height:44px;border-radius:22px;background:var(--seg);padding:0}
.cb-seg button{width:44px;height:44px;border-radius:50%;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--muted)}
.cb-seg button.on{background:var(--seg-on);color:var(--fg)}
.cb-seg.solo{background:none}
.cb-btn{width:44px;height:44px;border-radius:50%;border:0;background:none;color:var(--fg);display:grid;place-items:center;padding:0}
.cb-btn:active,.cb-seg button:active{opacity:.6}
.cb-lang{display:flex;align-items:center;gap:6px;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;font-family:var(--font);color:var(--muted)}
.cb-lang button{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;padding:0;color:var(--fg)}
.codeblock pre{margin:0;padding:10px 18px 20px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;color:var(--code-fg)}
.codeblock pre code{font-family:inherit;direction:ltr;unicode-bidi:isolate;display:block;background:none;padding:0;font-size:inherit}
.codeblock .preview{height:320px;border:0;width:100%;background:#fff;display:block}
.t-c{color:var(--tk-c)}.t-s{color:var(--tk-s)}.t-n{color:var(--tk-n)}.t-k{color:var(--tk-k)}.t-f{color:var(--tk-f)}.t-t{color:var(--tk-t)}.t-a{color:var(--tk-a)}

/* =====================================================
   Composer
===================================================== */
.composer-area{flex:none;position:relative;padding:6px 0 calc(16px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 34px 8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--composer);border-radius:16px;padding:6px 8px 6px 12px;font-size:14px;position:relative;max-width:100%}
.chip.img{padding:0;width:64px;height:64px;overflow:hidden}
.chip.img img{width:100%;height:100%;object-fit:cover}
.chip .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.chip button{width:22px;height:22px;border-radius:50%;border:0;background:var(--card2);color:var(--fg);display:grid;place-items:center;padding:0}
.chip.img button{position:absolute;top:4px;inset-inline-start:4px;background:rgba(0,0,0,.65);color:#fff}
.chip.deep{background:var(--card);}
.composer{margin:0 34px;min-height:48px;background:var(--composer);border-radius:26px;display:flex;align-items:center;gap:2px;padding:6px;transition:box-shadow .2s}
.composer:focus-within{box-shadow:0 0 0 1px var(--card2)}
.c-plus{width:44px;height:36px;border:0;background:none;color:var(--fg);display:grid;place-items:center;border-radius:18px;flex:none;transition:transform .2s var(--ease);padding:0}
.c-plus.open{transform:rotate(45deg)}
.composer textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:none;font-size:16px;line-height:24px;padding:6px 4px;height:36px;max-height:160px;align-self:center;caret-color:var(--accent)}
.composer textarea::placeholder{color:var(--muted)}
.c-mic{width:42px;height:36px;border:0;background:none;color:var(--fg);display:grid;place-items:center;border-radius:18px;flex:none;padding:0}
.c-mic.rec{color:var(--accent);animation:pulse 1.1s infinite}
.c-wave{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none;transition:transform .12s;padding:0}
.c-wave:active{transform:scale(.92)}

/* attach sheet */
.sheet-back{position:fixed;inset:0;z-index:650}
.sheet{position:fixed;width:min(255px,calc(100vw - 16px));background:var(--pop);border-radius:32px;padding:8px 14px;box-shadow:var(--shadow);animation:sheetIn .2s var(--ease) both;transform-origin:bottom right}
.sheet-row{display:flex;align-items:center;gap:14px;width:100%;height:60px;border:0;background:none;font-size:17px;text-align:start;border-radius:20px}
.sheet-row[disabled]{opacity:.4}
.sheet-ic{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex:none}

/* =====================================================
   Drawer
===================================================== */
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .28s;z-index:40}
.app.dr-open .scrim{opacity:1;pointer-events:auto}
.drawer{position:absolute;inset-block:0;inset-inline-start:0;width:min(80%,360px);background:var(--bg);border-inline-end:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .3s var(--ease);display:flex;flex-direction:column;overflow:hidden}
.app.dr-open .drawer{transform:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 20px 8px;flex:none;min-height:66px}
.dr-head h2{margin:0;font-size:24px;font-weight:600;direction:ltr}
.dr-search{flex:1;display:flex;align-items:center;gap:10px;height:44px;border-radius:22px;background:var(--circle);padding:0 14px;color:var(--muted)}
.dr-search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
.dr-scroll{flex:1;overflow-y:auto;padding:10px 8px 130px 20px}
.nav-item{display:flex;align-items:center;gap:14px;width:100%;height:48px;border:0;background:none;font-size:17px;font-weight:600;text-align:start;border-radius:14px;padding:0 12px}
.nav-item:active,.nav-item.on{background:var(--hover)}
.dr-sec{font-size:16px;font-weight:600;margin:30px 12px 8px}
.item{position:relative;display:flex;align-items:center;gap:14px;min-height:48px;padding:0 12px;border-radius:14px;cursor:pointer;font-size:17px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.item:hover,.item.active,.item.menu-open{background:var(--hover)}
.item .it{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-empty{color:var(--muted);font-size:14px;padding:6px 12px}
.arch-toggle{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--muted);font-size:14px;padding:18px 12px 6px}
.dr-fade{position:absolute;inset-inline:0;bottom:0;height:150px;background:linear-gradient(to top,var(--bg) 38%,transparent);pointer-events:none}
.dr-foot{position:absolute;inset-inline:0;bottom:0;padding:0 20px calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.dr-foot>*{pointer-events:auto}
.newchat-pill{height:48px;padding:0 22px;border-radius:24px;border:0;background:var(--newchat);color:var(--on-accent);display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
.avatar-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--circle-b);background:var(--circle);display:grid;place-items:center;padding:0}
.av{width:38px;height:38px;border-radius:50%;background:#7a4bd0;color:#fff;font-weight:600;font-size:15px;display:grid;place-items:center;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

/* =====================================================
   Content pages inside the main view (images, library, ...)
===================================================== */
.page{padding:6px 24px 40px;animation:fade .25s ease both}
.page h1{font-size:24px;font-weight:700;margin:6px 0 16px}
.pg-empty{text-align:center;color:var(--muted);padding:56px 12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pg-empty h3{margin:10px 0 0;color:var(--fg);font-size:18px}
.pg-empty p{margin:0 0 12px;max-width:280px}
.pill-btn{height:44px;padding:0 22px;border-radius:22px;border:0;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.add-row{display:flex;align-items:center;gap:12px;width:100%;height:52px;border:1px dashed var(--card2);background:none;border-radius:18px;padding:0 16px;color:var(--fg2);margin-bottom:12px;font-size:16px}
.row2{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 4px;border-bottom:1px solid var(--line)}
.row2:last-child{border-bottom:0}
.row2 .grow{flex:1;min-width:0}
.row2 .t{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row2 .d{font-size:13px;color:var(--muted)}
.row2.link{cursor:pointer}
.mini{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--muted);display:grid;place-items:center;padding:0}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.img-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;cursor:pointer}

/* =====================================================
   Full-screen settings screens
===================================================== */
.screens{position:fixed;inset:0;z-index:300;pointer-events:none}
.screen{position:absolute;inset:0;background:var(--bg);pointer-events:auto;animation:scrIn .24s var(--ease) both;max-width:720px;margin:0 auto}
.screen.out{animation:scrOut .18s ease both}
.scr-btn{position:absolute;top:calc(12px + env(safe-area-inset-top));z-index:3}
.scr-btn.start{inset-inline-start:14px}
.scr-btn.end{inset-inline-end:14px}
.scr-scroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
.scr-title{height:44px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;margin:0 56px 18px;text-align:center}
.scr-title.big{font-size:26px;font-weight:700}

.grp{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.grp>.row{border-radius:6px}
.grp>.row:first-child{border-top-left-radius:28px;border-top-right-radius:28px}
.grp>.row:last-child{border-bottom-left-radius:28px;border-bottom-right-radius:28px}
.grp>.row:only-child{border-radius:28px}
.row{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px;background:var(--card);position:relative;width:100%;border:0;text-align:start}
.row.tap{cursor:pointer}
.row.tap:active{background:var(--card2)}
.r-ic{width:24px;height:24px;display:grid;place-items:center;flex:none}
.r-tx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.r-t{font-size:15px}
.r-s{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.r-s i{width:12px;height:12px;border-radius:50%;display:inline-block}
.r-v{font-size:14px;color:var(--muted);flex:none}
.r-ch{color:var(--fg2);display:grid;place-items:center;flex:none}
.row.danger{color:var(--danger)}
.row.center{justify-content:center}
.sec-label{font-size:14px;color:var(--muted);padding:0 16px;margin:22px 0 8px}
.sec-label.first{margin-top:6px}
.cap{font-size:12.5px;color:var(--muted);line-height:1.6;padding:8px 16px 0;margin:0 0 18px}
.cap a,.link{color:var(--link);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.cap.light{color:var(--fg2)}
.field{width:100%;background:var(--card);border:0;outline:0;border-radius:28px;padding:16px 18px;font-size:15px;min-height:56px;resize:none;display:block}
.field::placeholder{color:var(--muted)}
.field:focus{box-shadow:0 0 0 1.5px var(--card2)}
textarea.field{min-height:110px;line-height:1.7;border-radius:28px}

/* Material-3 style switch (on = filled + knob at end, off = outlined + knob at start) */
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--sw-off-bd);background:var(--sw-off-bg);position:relative;flex:none;padding:0;transition:background .18s,border-color .18s}
.sw i{position:absolute;top:50%;inset-inline-start:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--sw-off-k);transition:all .18s var(--ease)}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"] i{inset-inline-start:22px;width:24px;height:24px;margin-top:-12px;margin-inline-start:-8px;background:var(--on-accent);}
html[data-accent="white"][data-theme="dark"] .sw[aria-checked="true"] i{background:var(--sw-on-k)}

/* dropdown popup */
.popup{position:fixed;z-index:900;min-width:200px;background:var(--pop);border-radius:26px;box-shadow:var(--shadow);padding:0;overflow:hidden;animation:pop .16s var(--ease) both;transform-origin:top left}
.pop-item{white-space:nowrap;display:flex;align-items:center;gap:14px;width:100%;height:50px;padding:0 20px;border:0;background:none;text-align:start;font-size:15px}
.pop-item:active{background:var(--card)}
.pop-item .tx{flex:1}
.pop-item .ck{width:24px;display:grid;place-items:center;order:2}
.pop-item i.dot{width:20px;height:20px;border-radius:50%;display:block}
.pop-item.danger{color:var(--danger)}
.pop-item .ic{display:grid;place-items:center}
.pop-sep{height:1px;background:var(--line);margin:4px 0}
.pop-head{padding:14px 20px 4px;font-size:14px;color:var(--muted);direction:rtl;text-align:start}
.pop-item .ic{width:24px;height:24px}

/* plans */
.plan-h{font-size:34px;font-weight:700;direction:rtl;margin:14px 8px 4px}
.plan-h b{color:var(--blue);font-weight:700}
.plan-sub{color:var(--fg2);font-size:14px;margin:0 8px 18px}
.seg2{display:flex;border:1.5px solid var(--card2);border-radius:26px;overflow:hidden;height:52px;direction:ltr;margin:0 0 16px}
.seg2 button{flex:1;border:0;background:transparent;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seg2 button.on{background:var(--card)}
.ptable{background:var(--circle);border:1px solid var(--circle-b);border-radius:28px;padding:18px 14px 8px;margin-bottom:22px}
.prow{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;min-height:62px;font-size:14.5px}
.prow.h{min-height:40px;color:var(--muted);font-size:13.5px}
.prow .c{display:grid;place-items:center}
.prow .c.p{color:var(--blue)}
.prow .c.free{color:var(--fg2)}
.prow.h .c.p{font-weight:700;color:var(--blue)}
.dash{width:18px;height:2px;background:var(--muted);border-radius:1px}
.buy-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border-radius:32px;border:0;background:var(--newchat);color:var(--on-newchat,var(--on-accent));font-size:16px;font-weight:600;line-height:1.3;padding:10px 24px;text-align:center}
.buy-btn[disabled]{background:var(--circle);color:var(--muted)}
.price{text-align:center;color:var(--fg2);font-size:15px;margin:0 0 12px}
.restore{display:block;margin:34px auto 14px;border:0;background:none;font-size:14px;color:var(--fg)}
.buy{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:76px;border-radius:38px;border:0;background:var(--circle);color:var(--muted);font-size:14.5px;line-height:1.7;padding:12px 28px}

/* usage */
.meter{background:var(--card);border-radius:28px;padding:16px 18px 14px}
.meter .r1{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.meter .r1 span:last-child{color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:3px;background:var(--card2);margin:14px 0 12px;overflow:hidden;direction:ltr}
.bar i{display:block;height:100%;background:#5b8def;border-radius:3px;transition:width .4s}
.meter .r3{font-size:12px;color:var(--muted)}

/* voice settings */
.v-orb-wrap{display:flex;flex-direction:column;align-items:center;margin:2px 0 22px;touch-action:pan-y;user-select:none}
.v-orb{width:96px;height:96px;border-radius:50%;margin:0 0 14px;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.04)}
.v-name{font-size:23px;font-weight:700;direction:ltr}
.v-desc{color:var(--muted);font-size:15px;margin-top:2px}
.v-dots{display:flex;gap:10px;margin:26px 0 0;direction:ltr}
.v-dots i{width:10px;height:10px;border-radius:50%;background:#4a4a4a}
.v-dots i.on{background:#4285f4}
[data-theme="light"] .v-dots i{background:#cfcfcf}[data-theme="light"] .v-dots i.on{background:#4285f4}

/* sub lists */
.list-card{background:var(--card);border-radius:28px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--card2);min-height:56px}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0}
.li .t{font-size:15px;overflow-wrap:anywhere}
.li .d{font-size:12.5px;color:var(--muted)}
.li .x{width:36px;height:36px;border:0;background:none;color:var(--muted);display:grid;place-items:center;border-radius:50%;padding:0}
.empty-note{color:var(--muted);text-align:center;padding:22px 16px;font-size:14px}
.btn-main{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;border:0;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:600}
.btn-sub{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:26px;border:0;background:var(--card);font-size:15px}
.chk-grid{display:flex;flex-wrap:wrap;gap:10px}
.chk{height:44px;padding:0 18px;border-radius:22px;border:1.5px solid var(--card2);background:none;font-size:15px;display:inline-flex;align-items:center;justify-content:center;line-height:1.2}
.chk.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ref-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.ref-grid .ph{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:var(--card)}
.ref-grid img{width:100%;height:100%;object-fit:cover}
.ref-grid button{position:absolute;top:6px;inset-inline-start:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;padding:0}
.big-code{direction:ltr;font-family:var(--mono);font-size:15px;letter-spacing:.08em;text-align:center;word-break:break-all;padding:14px 16px;background:var(--card);border-radius:20px;margin:10px 0}

/* =====================================================
   Dialogs, toast
===================================================== */
.backdrop{position:fixed;inset:0;z-index:800;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .15s ease both}
.backdrop.out{opacity:0;transition:opacity .15s}
.backdrop.bottom{align-items:flex-end;padding:0}
.dialog{background:var(--pop);color:var(--fg);border:1px solid var(--pop-b);border-radius:30px;box-shadow:var(--shadow);width:100%;max-width:420px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .2s var(--ease) both;outline:0}
.backdrop.bottom .dialog{max-width:720px;border-radius:30px 30px 0 0;animation:up .24s var(--ease) both;padding-bottom:env(safe-area-inset-bottom)}
.dlg-body{padding:24px 24px 6px;overflow:auto}
.dlg-body h3{margin:0 0 8px;font-size:18px;font-weight:600}
.dlg-body p{margin:0 0 12px;color:var(--fg2);font-size:14.5px;line-height:1.75}
.dlg-body label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.dlg-body .field{background:var(--card)}
.dlg-foot{display:flex;gap:8px;padding:14px 24px 22px;flex-wrap:wrap}
.btn{height:44px;padding:0 22px;border-radius:999px;border:1px solid var(--card2);background:none;font-size:15px;flex:1;min-width:110px;display:inline-flex;align-items:center;justify-content:center;line-height:1.2}
.btn.solid{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.toast{position:fixed;inset-inline:0;bottom:calc(100px + env(safe-area-inset-bottom));margin:auto;width:max-content;max-width:calc(100vw - 32px);z-index:1000;background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14.5px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 10px 12px}
.share-grid button{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font-size:12.5px;padding:6px 0}
.share-grid .ci{width:54px;height:54px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.sel-box{background:var(--card);border-radius:20px;padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto;line-height:1.7;margin-bottom:6px}
.auth-field{width:100%;height:54px;border-radius:27px;border:1px solid var(--card2);background:var(--bg);padding:0 20px;font-size:16px;outline:0}
.auth-field:focus{border-color:var(--fg)}
.auth-or{display:flex;align-items:center;gap:12px;width:100%;color:var(--muted);font-size:13px;margin:4px 0}
.auth-or:before,.auth-or:after{content:'';flex:1;height:1px;background:var(--card2)}
.auth-primary{width:100%;height:54px;border-radius:27px;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:600}
.auth-primary:disabled{opacity:.5}
.auth-err{color:var(--danger);font-size:13px;min-height:18px;margin:0 !important}
.auth-hint{font-size:13px;color:var(--muted);margin:0 !important}
.emoji-bar{position:fixed;z-index:900;background:var(--pop);border:1px solid var(--pop-b);border-radius:28px;box-shadow:var(--shadow);display:flex;padding:6px;gap:2px;animation:pop .16s var(--ease) both}
.emoji-bar button{width:42px;height:42px;border:0;background:none;font-size:23px;border-radius:50%;padding:0}
.emoji-bar button:active{background:var(--card)}

/* =====================================================
   Voice mode, camera, auth, lock
===================================================== */
.voice{position:fixed;inset:0;z-index:700;background:var(--bg);display:flex;flex-direction:column;align-items:center;padding:calc(18px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom));animation:fade .25s ease both}
.voice .v-top{align-self:flex-start;width:100%}
.v-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;text-align:center}
.orb{width:170px;height:170px;border-radius:50%;animation:orb 1.8s ease-in-out infinite}
.orb.muted{animation:none;transform:scale(.8);filter:grayscale(1) brightness(.6)}
.orb.think{animation:orbThink 1.2s ease-in-out infinite}
#vStatus{color:var(--fg2);min-height:56px;max-width:320px;margin:0}
.v-bar{display:flex;gap:28px}
.v-bar .circle{width:64px;height:64px}
.v-bar .circle.end{background:#e5484d;color:#fff;border-color:#e5484d}
.v-bar .circle.on{background:var(--card)}
.cam{position:fixed;inset:0;z-index:720;background:#000;display:flex;flex-direction:column;animation:fade .2s ease both;direction:ltr}
.cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cam-bar{display:flex;align-items:center;justify-content:space-around;padding:20px 20px calc(24px + env(safe-area-inset-bottom));background:#000}
.cam-bar button{border:0;display:grid;place-items:center;padding:0;color:#fff}
.cam-shot{width:72px;height:72px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #000,0 0 0 6px #fff}
.cam-sec{width:48px;height:48px;border-radius:50%;background:#262626}
.cam-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#ddd;padding:30px;direction:rtl;pointer-events:none}
.auth,.lock{position:fixed;inset:0;z-index:600;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .3s ease both}
.auth-x{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-start:14px}
.auth-box{width:100%;max-width:360px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.auth-logo{width:84px;height:84px;margin-bottom:10px;color:var(--fg)}
.auth-box h1{margin:0;font-size:26px;font-weight:700}
.auth-box p{margin:0 0 14px;color:var(--muted);line-height:1.7}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:54px;border-radius:27px;border:1px solid var(--card2);background:var(--bg);font-size:17px;font-weight:500}
.auth-btn:active{transform:scale(.98)}
.auth-link{border:0;background:none;color:var(--link);font-size:15px;padding:10px}
.auth-note{font-size:12.5px;line-height:1.7}

.adv-toggle{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--fg2);font-size:15px;padding:18px 16px 10px}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes scrIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:translateX(-28px)}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes pulse{50%{opacity:.45}}
@keyframes orb{0%,100%{transform:scale(.94)}50%{transform:scale(1.05)}}
@keyframes orbThink{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(.98);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (max-width:380px){.composer,.chips{margin-inline:20px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <button class="circle" id="menuBtn" aria-label="باز کردن منو"><span data-icon="menu"></span></button>
    <button class="plus-pill" id="plusPill" aria-label="دریافت Plus"><span data-icon="sparkle"></span><span>دریافت</span><b>Plus</b></button>
    <div class="grow" id="topTitle"></div>
    <button class="circle" id="tempBtn" aria-label="چت موقت" aria-pressed="false"><span data-icon="temp"></span></button>
    <div class="pill2" id="topPill" hidden>
      <button id="moreBtn" aria-label="گزینه‌ها"><span data-icon="more_v"></span></button>
      <button id="composeBtn" aria-label="گفتگوی جدید"><span data-icon="compose"></span></button>
    </div>
  </header>

  <div class="view">
    <div class="scroll" id="scroll"></div>
    <button class="down-btn hide" id="downBtn" aria-label="رفتن به پایین"><span data-icon="down"></span></button>
  </div>

  <div class="composer-area" id="composerArea">
    <div class="chips" id="chips" hidden></div>
    <div class="composer" id="composer">
      <button class="c-plus" id="plus" aria-label="افزودن" aria-haspopup="menu"><span data-icon="c_plus"></span></button>
      <textarea id="input" rows="1" aria-label="پیام"></textarea>
      <button class="c-mic" id="mic" aria-label="تایپ با صدا"><span data-icon="c_mic"></span></button>
      <button class="c-wave" id="wave"></button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="منو">
    <div class="dr-head" id="drHead"></div>
    <div class="dr-scroll" id="drList"></div>
    <div class="dr-fade"></div>
    <div class="dr-foot">
      <button class="newchat-pill" id="newChat"><span data-icon="newchat"></span><span>چت</span></button>
      <button class="avatar-btn" id="avatarBtn" aria-label="تنظیمات"></button>
    </div>
  </aside>
</div>

<div class="screens" id="screens"></div>

<input type="file" id="fileAny" multiple hidden>
<input type="file" id="fileImg" accept="image/*" multiple hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileRef" accept="image/*" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';

/* =====================================================
   Config
   - GOOGLE_CLIENT_ID : OAuth "Web client ID" (Google Cloud Console).
                        It can also be pasted in-app on first sign-in.
   - API_URL          : optional chat endpoint. POST {system, messages, options}
                        and return {text}. Empty = placeholder replies.
===================================================== */
const CONFIG = {
  GOOGLE_CLIENT_ID: '',   // Google OAuth Web client ID
  API: { base: '', key: '', model: '', modelPlus: '', modelDeep: '', imageModel: '' }, // OpenAI-compatible (e.g. https://api.openai.com/v1). key may be plain or 'enc:...' (see __enc in the console); it is never shown in the UI
  API_URL: '',            // or: your own proxy, POST {system,messages,options} -> {text}
  BALE: { botToken: '', providerToken: '', proxyUrl: '', miniappUrl: '' }, // Bale Pay (createInvoiceLink + WebApp.openInvoice)
  PLANS: { go: { title: 'ChatGPT Go', amount: 500000, days: 30, quota: 300 }, plus: { title: 'ChatGPT Plus', amount: 1500000, days: 30, quota: 1000 } }, // amount in IRR
  EMAILJS: { serviceId: '', templateId: '', publicKey: '' }, // sends the e-mail verification code (emailjs.com)
  SMS_URL: '',            // optional: POST {phone} sends a code, POST {phone, code} verifies it
  REPORT_URL: ''          // optional: bug reports endpoint
};

/* =====================================================

      const c = this.store('readonly').openCursor();
      c.onsuccess = () => {
        const cur = c.result;
        if (cur) { this.urls.set(cur.key, URL.createObjectURL(cur.value)); this.sizes.set(cur.key, cur.value.size); cur.continue(); } else res();
      };
      c.onerror = () => res();
    });
  },
  async add(id, blob) { this.urls.set(id, URL.createObjectURL(blob)); this.sizes.set(id, blob.size); await this.req(s => s.put(blob, id)); },
  url: id => Blobs.urls.get(id),
  async remove(id) { const u = this.urls.get(id); if (u) URL.revokeObjectURL(u); this.urls.delete(id); this.sizes.delete(id); await this.req(s => s.delete(id)); },
  async clear() { this.urls.forEach(u => URL.revokeObjectURL(u)); this.urls.clear(); this.sizes.clear(); await this.req(s => s.clear()); },
  total() { let n = 0; this.sizes.forEach(v => { n += v; }); return n; }
};

let toastTimer;
function toast(msg, act) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${act ? `<button type="button">${esc(act.label)}</button>` : ''}`;
  if (act) $('button', el).onclick = () => { act.fn(); el.classList.remove('show'); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), act ? 4500 : 2600);
}

let popup = null;
function closePopup() {
  if (!popup) return;
  popup.el.remove();
  if (popup.anchor) popup.anchor.classList.remove('open');
  const cb = popup.onClose; popup = null;
  if (cb) cb();
}
/* items: { label, icon?, dot?, check?, danger?, onClick } | 'sep' */
function openPopup(anchor, items, opts = {}) {
  if (popup && popup.anchor === anchor) return closePopup();
  closePopup();
  const el = document.createElement('div');
  el.className = 'popup'; el.setAttribute('role', 'menu');
  if (opts.width) el.style.width = opts.width + 'px';
  el.innerHTML = (opts.header ? `<div class="pop-head">${esc(opts.header)}</div>` : '') + items.map((it, i) => it === 'sep' ? '<div class="pop-sep"></div>' :
    `<button class="pop-item${it.danger ? ' danger' : ''}" type="button" role="menuitem" data-i="${i}">${it.dot ? `<i class="dot" style="background:${it.dot}"></i>` : it.icon ? `<span class="ic">${icon(it.icon)}</span>` : ''}<span class="tx">${esc(it.label)}</span>${it.check ? `<span class="ck">${icon('menu_check')}</span>` : ''}</button>`).join('');
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(), mw = el.offsetWidth, mh = el.offsetHeight;
  let top = (opts.overlap ? r.top + 6 : r.bottom + 4), up = false;
  if (top + mh > innerHeight - 8) { top = Math.max(8, r.top - mh - 4); up = true; }
  let left = opts.align === 'right' ? r.right - mw : opts.align === 'center' ? r.left + (r.width - mw) / 2 : r.left;
  left = Math.min(Math.max(8, left), innerWidth - mw - 8);
  el.style.top = top + 'px'; el.style.left = left + 'px';
  el.style.transformOrigin = (up ? 'bottom ' : 'top ') + (opts.align === 'right' ? 'right' : 'left');
  anchor.classList.add('open');
  el.addEventListener('click', e => {
    const b = e.target.closest('.pop-item'); if (!b) return;
    const it = items[+b.dataset.i]; closePopup(); if (it.onClick) it.onClick();
  });
  popup = { el, anchor, onClose: opts.onClose };
}
document.addEventListener('pointerdown', e => {
  if (popup && !popup.el.contains(e.target) && !(popup.anchor && popup.anchor.contains(e.target))) closePopup();
});

const modals = [];
function openModal({ cls = '', html, bottom = false }) {
  const back = document.createElement('div');
  back.className = 'backdrop' + (bottom ? ' bottom' : '');
  back.innerHTML = `<div class="dialog ${cls}" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  document.body.appendChild(back);
  hydrateIcons(back);
  const dlg = back.firstElementChild, prev = document.activeElement;
  let closed = false;
  const api = {
    el: dlg, onClose: null,
    close() {
      if (closed) return; closed = true;
      back.classList.add('out'); setTimeout(() => back.remove(), 150);
      modals.splice(modals.indexOf(api), 1);
      if (prev && prev.focus) { try { prev.focus(); } catch {} }
      if (api.onClose) api.onClose();
    }
  };
  back.addEventListener('pointerdown', e => { if (e.target === back) api.close(); });
  modals.push(api);
  const auto = $('[autofocus]', dlg); (auto || dlg).focus();
  return api;
}
function confirmDialog({ title, text, ok = 'تأیید', danger = false }) {
  return new Promise(res => {
    const m = openModal({ html: `<div class="dlg-body"><h3>${esc(title)}</h3><p>${esc(text)}</p></div><div class="dlg-foot"><button class="btn ${danger ? 'danger' : 'solid'}" data-r="1" type="button">${esc(ok)}</button><button class="btn" data-r="0" type="button">انصراف</button></div>` });
    let done = false;
    const fin = v => { if (done) return; done = true; m.close(); res(v); };
    m.el.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) fin(b.dataset.r === '1'); });
    m.onClose = () => fin(false);
  });
}
function promptDialog({ title, label, value = '', ok = 'ذخیره', type = 'text', placeholder = '', dir = 'auto', text = '' }) {
  return new Promise(res => {
    const m = openModal({ html: `<div class="dlg-body"><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}<label for="pdIn">${esc(label)}</label><input class="field" id="pdIn" type="${type}" dir="${dir}" maxlength="120" autofocus placeholder="${esc(placeholder)}" value="${esc(value)}"></div><div class="dlg-foot"><button class="btn solid" data-r="1" type="button">${esc(ok)}</button><button class="btn" data-r="0" type="button">انصراف</button></div>` });
    const input = $('#pdIn', m.el); input.select();
    let done = false;
    const fin = v => { if (done) return; done = true; m.close(); res(v); };
    m.el.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) fin(b.dataset.r === '1' ? input.value.trim() : null); });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) fin(input.value.trim()); });
    m.onClose = () => fin(null);
  });
}
function infoDialog(title, html, ok = 'متوجه شدم') {
  const m = openModal({ html: `<div class="dlg-body"><h3>${esc(title)}</h3>${html}</div><div class="dlg-foot"><button class="btn solid" data-r type="button">${esc(ok)}</button></div>` });
  m.el.addEventListener('click', e => { if (e.target.closest('[data-r]')) m.close(); });
  return m;
}

/* Share: native share sheet when available, otherwise a share dialog that really works */
async function shareText(text, title = 'ChatGPT') {
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const enc = encodeURIComponent(text);
  const targets = [
    ['copy', 'کپی', 'p_copy', async () => { if (await copyText(text)) toast('کپی شد'); }],
    ['telegram', 'Telegram', 'p_share', () => window.open('https://t.me/share/url?url=%20&text=' + enc, '_blank', 'noopener')],
    ['whatsapp', 'WhatsApp', 'p_share', () => window.open('https://wa.me/?text=' + enc, '_blank', 'noopener')],
    ['mail', 'ایمیل', 'mail', () => { location.href = 'mailto:?subject=' + encodeURIComponent(title) + '&body=' + enc; }],
    ['sms', 'پیامک', 'bubble', () => { location.href = 'sms:?body=' + enc; }],
    ['x', 'X', 'p_share', () => window.open('https://twitter.com/intent/tweet?text=' + enc.slice(0, 1200), '_blank', 'noopener')],
    ['file', 'فایل متنی', 'download', () => download('chatgpt.txt', text, 'text/plain')]
  ];
  const m = openModal({ bottom: true, html: `<div class="dlg-body"><h3>اشتراک‌گذاری</h3></div><div class="share-grid">${targets.map(([k, l, ic]) => `<button type="button" data-k="${k}"><span class="ci">${icon(ic)}</span><span>${l}</span></button>`).join('')}</div>` });
  m.el.addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (!b) return; m.close(); targets.find(t => t[0] === b.dataset.k)[3](); });
}

function renderMarkdown(src) {
  const lines = src.replace(/\r/g, '').split('\n');
  const out = [];
  const isSep = s => s !== undefined && s.includes('-') && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
  const cells = s => s.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  const UL = /^\s*[-*+]\s+/, OL = /^\s*\d+[.)]\s+/;
  let i = 0, m;
  while (i < lines.length) {
    const line = lines[i];
    if ((m = line.match(/^\s*`{3}(\S*)/))) {
      const buf = []; i++;
      while (i < lines.length && !/^\s*`{3}\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(codeBlock(buf.join('\n'), m[1]));
      continue;
    }
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { const n = m[1].length + 1; out.push(`<h${n} dir="auto">${inline(m[2])}</h${n}>`); i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (line.includes('|') && isSep(lines[i + 1])) {
      const head = cells(line); i += 2;
      const rows = [];
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) rows.push(cells(lines[i++]));
      out.push(`<div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);
      continue;
    }
    if (/^\s*>/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${buf.map(inline).join('<br>')}</blockquote>`); continue;
    }
    if (UL.test(line)) {
      const items = [];
      while (i < lines.length && UL.test(lines[i])) items.push(lines[i++].replace(UL, ''));
      out.push(`<ul>${items.map(t => `<li>${inline(t)}</li>`).join('')}</ul>`); continue;
    }
    if (OL.test(line)) {
      const items = [];
      while (i < lines.length && OL.test(lines[i])) items.push(lines[i++].replace(OL, ''));
      out.push(`<ol>${items.map(t => `<li>${inline(t)}</li>`).join('')}</ol>`); continue;
    }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() && !/^\s*(`{3}|#{1,4}\s|>|[-*+]\s|\d+[.)]\s)/.test(lines[i]) && !(lines[i].includes('|') && isSep(lines[i + 1]))) buf.push(lines[i++]);
    out.push(`<p dir="auto">${buf.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

const SALT = 'ChatGPT-mobile';
const encodeSecret = v => 'enc:' + btoa(String.fromCharCode(...[...v].map((c, i) => c.charCodeAt(0) ^ SALT.charCodeAt(i % SALT.length))));
const secret = v => {
  if (!v) return '';
  if (!v.startsWith('enc:')) return v;
  try { return [...atob(v.slice(4))].map((c, i) => String.fromCharCode(c.charCodeAt(0) ^ SALT.charCodeAt(i % SALT.length))).join(''); } catch { return ''; }
};

const blobData = async (id, text) => {
  const u = Blobs.url(id); if (!u) return '';
  const b = await (await fetch(u)).blob();
  if (text) return (await b.text()).slice(0, 60000);
  return new Promise(res => { const f = new FileReader(); f.onload = () => res(f.result); f.readAsDataURL(b); });
};

  const rd = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { done, value } = await rd.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (line.startsWith('data:')) { const d = line.slice(5).trim(); if (d === '[DONE]') return; yield d; }
    }

}
/* plugins: web search (Wikipedia) and link reader (r.jina.ai) */
async function webContext(q, signal) {
  q = q.replace(/\s+/g, ' ').trim().slice(0, 120); if (q.length < 4) return '';
  const lang = S.lang.split('-')[0];
  try {
    const r = await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exchars=800&format=json&origin=*`, { signal });
    const j = await r.json();
    return Object.values((j.query && j.query.pages) || {}).sort((a, b) => a.index - b.index).map(p => `# ${p.title}\n${p.extract}`).join('\n\n');
  } catch (e) { if (e.name === 'AbortError') throw e; return ''; }
}
async function linkContext(text, signal) {
  const out = [];
  for (const u of (text.match(/https?:\/\/[^\s)]+/g) || []).slice(0, 2)) {
    try { const r = await fetch('https://r.jina.ai/' + u, { signal }); if (r.ok) out.push(`# ${u}\n` + (await r.text()).slice(0, 6000)); } catch (e) { if (e.name === 'AbortError') throw e; }
  }
  return out.join('\n\n');
}

const AIService = {
  async stream(messages, { signal, deep, onDelta }) {
    const last = [...messages].reverse().find(m => m.role === 'user') || { content: '' };
    if (apiReady()) return this.direct(messages, last, { signal, deep, onDelta });
    if (CONFIG.API_URL) {
      const options = { deep: !!deep, lang: S.lang, plan: S.plan.id };
      const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal, body: JSON.stringify({ system: buildSystem(), messages: messages.map(m => ({ role: m.role, content: m.content })), options }) });
      if (!r.ok) throw new Error('API ' + r.status);
      const t = String((await r.json()).text || ''); onDelta(t); return t;
    }
    await wait(deep ? 1800 : 500, signal);
    const t = mockReply(last.content || '');
    for (let i = 0; i < t.length; i += 4) { onDelta(t.slice(i, i + 4)); await wait(16, signal); }
    return t;
  },
  async direct(messages, last, { signal, deep, onDelta }) {
    const sys = [buildSystem()];
    if (!S.sec.lockMode) {
      const jobs = [];
      if (S.plugins.web && S.webSearch) jobs.push(webContext(last.content || '', signal).then(t => { if (t) sys.push('Web search results (Wikipedia):\n' + t); }));
      if (S.plugins.links) jobs.push(linkContext(last.content || '', signal).then(t => { if (t) sys.push('Content of the links in the user message:\n' + t); }));
      await Promise.all(jobs);
    }
    if (deep) sys.push('Think carefully and step by step before answering.');
    const api = [{ role: 'system', content: sys.join('\n\n') }];
    for (const m of messages) {
      const atts = (m.attachments || []).filter(a => a.id);
      if (m.role !== 'user' || !atts.length) { if (m.content) api.push({ role: m.role, content: m.content }); continue; }
      const parts = []; let text = m.content || '';
      for (const a of atts) {
        if (a.isImage) { const u = await blobData(a.id); if (u) parts.push({ type: 'image_url', image_url: { url: u } }); }
        else if (/^text\/|json|xml|csv|javascript/.test(a.type || '') || /\.(txt|md|csv|json|js|py|html|css|xml|log)$/i.test(a.name)) text += `\n\nFile: ${a.name}\n${await blobData(a.id, true)}`;
        else text += `\n\n[Attached file: ${a.name}]`;
      }
      api.push({ role: 'user', content: [{ type: 'text', text: text || ' ' }, ...parts] });
    }
    const r = await fetch(apiBase() + '/chat/completions', { method: 'POST', signal, headers: authHeaders(), body: JSON.stringify({ model: modelFor(deep), messages: api, stream: true }) });
    if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch {} throw new Error(m || 'API ' + r.status); }
    let all = '';
    for await (const d of sseLines(r)) { try { const t = JSON.parse(d).choices[0].delta.content; if (t) { all += t; onDelta(t); } } catch {} }
    return all;
  }
};

===================================================== */
function setDrawer(open) {
  state.drawer = open;
  app.classList.toggle('dr-open', open);
  $('#drawer').inert = !open;
  if (!open && state.searching) { state.searching = false; state.query = ''; renderDrawerHead(); renderDrawerList(); }
}
const NAV = [
  { id: 'images', label: 'تصاویر', icon: 'nav_images' },
  { id: 'library', label: 'کتابخانه', icon: 'nav_library' },
  { id: 'projects', label: 'پروژه‌ها', icon: 'nav_folder' },
  { id: 'tasks', label: 'زمان‌بندی‌شده', icon: 'nav_clock' },
  { id: 'plugins', label: 'افزونه‌ها', icon: 'nav_plugin' }
];
function renderDrawerHead() {
  const h = $('#drHead');
  if (state.searching) {
    h.innerHTML = `<label class="dr-search">${icon('search', 20)}<input id="drSearch" type="search" value="${esc(state.query)}" placeholder="جستجو در گفتگوها" autocomplete="off" aria-label="جستجو در گفتگوها"></label><button class="circle" id="searchClose" aria-label="بستن جستجو">${icon('close', 20)}</button>`;
    setTimeout(() => { const i = $('#drSearch'); if (i) i.focus(); }, 30);
  } else {
    h.innerHTML = `<h2>ChatGPT</h2><button class="circle" id="searchBtn" aria-label="جستجو">${icon('search')}</button>`;
  }
}
const itemHTML = (c, withIcon) => `<div class="item${c.id === state.activeId && state.view === 'chat' ? ' active' : ''}" data-id="${c.id}" tabindex="0" role="button">${withIcon ? icon('bubble') : ''}<span class="it">${esc(c.title)}</span></div>`;
function renderDrawerList() {
  const q = state.query.trim().toLowerCase();
  const match = c => !q || c.title.toLowerCase().includes(q) || c.messages.some(m => m.content.toLowerCase().includes(q));
  const all = state.conversations.filter(c => !c.temp).sort((a, b) => b.updatedAt - a.updatedAt);
  const pinned = all.filter(c => c.pinned && !c.archived && match(c));
  const recent = all.filter(c => !c.pinned && !c.archived && match(c));
  const arch = all.filter(c => c.archived && match(c));
  const archAll = all.filter(c => c.archived).length;
  let h = '';
  if (!q) h += NAV.map(n => `<button class="nav-item${state.view === n.id ? ' on' : ''}" type="button" data-view="${n.id}">${icon(n.icon)}<span>${n.label}</span></button>`).join('');
  if (pinned.length) h += '<h3 class="dr-sec">سنجاق شد</h3>' + pinned.map(c => itemHTML(c, true)).join('');
  h += `<h3 class="dr-sec">${q ? 'نتایج جستجو' : 'اخیر'}</h3>`;
  h += recent.length ? recent.map(c => itemHTML(c, false)).join('') : (pinned.length && !q ? '' : `<div class="dr-empty">${q ? 'نتیجه‌ای پیدا نشد.' : 'هنوز گفتگویی ندارید.'}</div>`);
  if (archAll) {
    const show = state.showArchived || (q && arch.length);
    h += `<button class="arch-toggle" id="archToggle" type="button" aria-expanded="${!!show}">${icon('archive', 16)}<span>بایگانی‌شده‌ها (${faNum(archAll)})</span></button>`;
    if (show) h += arch.map(c => itemHTML(c, false)).join('');
  }
  $('#drList').innerHTML = h;
}
const convMenu = c => [
  { label: c.pinned ? 'برداشتن سنجاق' : 'سنجاق کردن', icon: 'pin', onClick: () => { c.pinned = !c.pinned; persist(); renderDrawerList(); } },
  { label: 'تغییر نام', icon: 'pencil', onClick: () => renameConv(c.id) },
  c.archived ? { label: 'خارج کردن از بایگانی', icon: 'archive', onClick: () => unarchiveConv(c.id) } : { label: 'بایگانی', icon: 'archive', onClick: () => archiveConv(c.id) },
  { label: 'حذف', icon: 'trash', danger: true, onClick: () => deleteConv(c.id) }
];
let lpTimer = null, lpFired = false, lpStart = null;
const drList = $('#drList');
drList.addEventListener('pointerdown', e => {
  const it = e.target.closest('.item'); if (!it) return;
  lpFired = false; lpStart = { x: e.clientX, y: e.clientY };
  clearTimeout(lpTimer);
  lpTimer = setTimeout(() => {
    lpFired = true;
    const c = getConv(it.dataset.id); if (c) { if (navigator.vibrate) navigator.vibrate(12); openPopup(it, convMenu(c), { align: 'left', width: 230 }); }
  }, 480);
});
const cancelLp = () => clearTimeout(lpTimer);
drList.addEventListener('pointerup', cancelLp);
drList.addEventListener('pointercancel', cancelLp);
drList.addEventListener('pointermove', e => { if (lpStart && Math.hypot(e.clientX - lpStart.x, e.clientY - lpStart.y) > 10) cancelLp(); });
drList.addEventListener('contextmenu', e => {
  const it = e.target.closest('.item'); if (!it) return;
  e.preventDefault(); cancelLp(); lpFired = true;
  const c = getConv(it.dataset.id); if (c) openPopup(it, convMenu(c), { align: 'left', width: 230 });
});
drList.addEventListener('click', e => {
  if (lpFired) { lpFired = false; return; }
  const nav = e.target.closest('[data-view]');
  if (nav) { setView(nav.dataset.view); return; }
  if (e.target.closest('#archToggle')) { state.showArchived = !state.showArchived; renderDrawerList(); return; }
  const it = e.target.closest('.item'); if (it) selectConv(it.dataset.id);
});
drList.addEventListener('keydown', e => { if (e.key === 'Enter') { const it = e.target.closest('.item'); if (it) selectConv(it.dataset.id); } });
$('#drHead').addEventListener('click', e => {
  if (e.target.closest('#searchBtn')) { state.searching = true; renderDrawerHead(); renderDrawerList(); }
  if (e.target.closest('#searchClose')) { state.searching = false; state.query = ''; renderDrawerHead(); renderDrawerList(); }
});
$('#drHead').addEventListener('input', e => { if (e.target.id === 'drSearch') { state.query = e.target.value; renderDrawerList(); } });

/* =====================================================
   Conversation operations
===================================================== */
function pruneEmpty(keepId) {
  state.conversations = state.conversations.filter(c => {
    if (state.generating && state.generating.convId === c.id) return true;
    if (c.id === keepId) return true;
    if (c.temp) return false;
    return c.messages.length > 0;
  });
}
function newChat(opts = {}) {
  setDrawer(false);
  state.view = 'chat';
  if (state.temp && !opts.keepTemp) setTemp(false);
  let c;
  if (state.temp) {
    c = { id: uid(), title: 'چت موقت', temp: true, messages: [], createdAt: Date.now(), updatedAt: Date.now(), archived: false };
    state.conversations.unshift(c);
  } else {
    c = state.conversations.find(x => !x.archived && !x.temp && !x.messages.length);
    if (!c) { c = { id: uid(), title: 'چت جدید', messages: [], createdAt: Date.now(), updatedAt: Date.now(), archived: false }; state.conversations.unshift(c); }
  }
  state.activeId = c.id;
  pruneEmpty(c.id);
  ta.value = ''; state.attachments = []; state.deep = false; renderChips(); autosize();
  persist(); renderDrawerList(); renderView();
  if (!opts.noFocus && !isTouch) setTimeout(() => ta.focus(), 50);
}
function selectConv(id) {
  if (state.temp) setTemp(false);
  state.activeId = id; state.view = 'chat'; pruneEmpty(id);
  persist(); renderDrawerList(); renderView(); setDrawer(false);
}
function setView(v) { state.view = v; setDrawer(false); renderDrawerList(); renderView(); }
async function renameConv(id) {
  const c = getConv(id); if (!c) return;
  const v = await promptDialog({ title: 'تغییر نام گفتگو', label: 'عنوان جدید', value: c.title });
  if (v) { c.title = v; persist(); renderDrawerList(); }
}
function archiveConv(id) {
  const c = getConv(id); if (!c) return;
  c.archived = true; c.pinned = false;
  if (state.activeId === id) state.activeId = null;
  persist(); renderDrawerList(); renderView();
  toast('گفتگو بایگانی شد', { label: 'بازگردانی', fn: () => { c.archived = false; persist(); renderDrawerList(); } });
}
function unarchiveConv(id) { const c = getConv(id); if (!c) return; c.archived = false; persist(); renderDrawerList(); toast('گفتگو از بایگانی خارج شد'); }
async function deleteConv(id) {
  const c = getConv(id); if (!c) return;
  const ok = await confirmDialog({ title: 'حذف گفتگو؟', text: `«${c.title}» برای همیشه حذف می‌شود.`, ok: 'حذف', danger: true });
  if (!ok) return;
  if (state.generating && state.generating.convId === id) state.generating.ctrl.abort();
  state.conversations = state.conversations.filter(x => x.id !== id);
  if (state.activeId === id) state.activeId = null;
  persist(); renderDrawerList(); renderView(); toast('گفتگو حذف شد');
}

function taskDialog() {
  const now = new Date();
  const hm = String(now.getHours()).padStart(2, '0') + ':' + String(Math.min(59, now.getMinutes() + 1)).padStart(2, '0');
  const m = openModal({ html: `<div class="dlg-body"><h3>یادآوری جدید</h3><label for="tkT">عنوان</label><input class="field" id="tkT" maxlength="60" autofocus placeholder="مثلاً مرور پروژه"><label for="tkH">ساعت</label><input class="field" id="tkH" type="time" value="${hm}"><label for="tkR">تکرار</label><select class="field" id="tkR"><option value="once">یک‌بار</option><option value="daily">هر روز</option><option value="weekly">هر هفته</option></select></div><div class="dlg-foot"><button class="btn solid" data-r="1" type="button">ذخیره</button><button class="btn" data-r="0" type="button">انصراف</button></div>` });
  m.el.addEventListener('click', async e => {
    const b = e.target.closest('[data-r]'); if (!b) return;
    if (b.dataset.r === '1') {
      const title = $('#tkT', m.el).value.trim(), time = $('#tkH', m.el).value;
      if (!title || !time) { toast('عنوان و ساعت را وارد کنید'); return; }
      state.tasks.push({ id: uid(), title, time, repeat: $('#tkR', m.el).value, day: new Date().getDay(), on: true, last: '' });
      persistExtras(); renderView(); toast('یادآوری ذخیره شد');
      if (S.notif.tasks) ensureNotifPermission();
    }
    m.close();
  });
}
setInterval(() => {
  const now = new Date();
  const hm = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const key = now.toDateString() + hm;
  let changed = false;
  state.tasks.forEach(t => {
    if (!t.on || t.time !== hm || t.last === key) return;
    if (t.repeat === 'weekly' && t.day !== now.getDay()) return;
    t.last = key; changed = true; toast('یادآوری: ' + t.title);
    notify('tasks', 'یادآوری', t.title, { always: true });
    if (t.repeat === 'once') t.on = false;
  });
  if (changed) { persistExtras(); if (state.view === 'tasks') renderView(); }
}, 15000);

}

const EMOJIS = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
function openEmojiBar(anchor, m, conv) {
  closePopup();
  const bar = document.createElement('div');
  bar.className = 'emoji-bar';
  bar.innerHTML = EMOJIS.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('');
  document.body.appendChild(bar);
  const r = anchor.getBoundingClientRect();
  const w = bar.offsetWidth;
  bar.style.top = Math.max(8, r.top - bar.offsetHeight - 8) + 'px';
  bar.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + 'px';
  const kill = () => { bar.remove(); document.removeEventListener('pointerdown', off, true); };
  const off = e => { if (!bar.contains(e.target)) kill(); };
  setTimeout(() => document.addEventListener('pointerdown', off, true), 0);
  bar.addEventListener('click', e => {
    const b = e.target.closest('[data-e]'); if (!b) return;
    m.react = m.react === b.dataset.e ? null : b.dataset.e; persist(); kill(); renderThread();
  });
}
function feedbackDialog(m) {
  const reasons = ['نادرست بود', 'مفید نبود', 'ناکامل بود', 'مناسب نبود', 'سایر'];
  const dlg = openModal({ bottom: true, html: `<div class="dlg-body"><h3>چه مشکلی داشت؟</h3><div class="chk-grid" id="fbR">${reasons.map(r => `<button class="chk" type="button" data-r="${r}">${r}</button>`).join('')}</div><label for="fbT" style="margin-top:16px">توضیح بیشتر (اختیاری)</label><textarea class="field" id="fbT" rows="3" placeholder="چه چیزی باید بهتر می‌شد؟"></textarea></div><div class="dlg-foot"><button class="btn solid" data-ok type="button">ارسال</button><button class="btn" data-no type="button">انصراف</button></div>` });
  dlg.el.addEventListener('click', e => {
    const c = e.target.closest('.chk'); if (c) c.classList.toggle('on');
    if (e.target.closest('[data-ok]')) {
      m.feedbackNote = { reasons: $$('.chk.on', dlg.el).map(x => x.dataset.r), text: $('#fbT', dlg.el).value.trim() };
      persist(); dlg.close(); toast('از بازخورد شما سپاسگزاریم');
    }
    if (e.target.closest('[data-no]')) { m.feedback = null; persist(); renderThread(); dlg.close(); }
  });
}
scroller.addEventListener('click', async e => {
  const sg = e.target.closest('[data-sugg]');

      break;
    case 'share': shareText(m.content, conv.title); break;
    case 'more':
      openPopup(b, [
        { label: 'تولید دوباره', icon: 'regen', onClick: () => { if (state.generating) { toast('ابتدا تولید پاسخ فعلی را متوقف کنید'); return; } conv.messages.splice(idx); persist(); generate(conv.id); } },

function codeAction(btn) {
  const block = btn.closest('.codeblock'), code = $('code', block);
  const raw = code.dataset.raw !== undefined ? code.dataset.raw : code.textContent;
  switch (btn.dataset.cb) {
    case 'copy': copyText(code.textContent).then(ok => { if (ok) toast('کد کپی شد'); }); break;
    case 'select': { const r = document.createRange(); r.selectNodeContents(code); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('کد انتخاب شد'); break; }
    case 'run': {
      let f = $('.preview', block);
      if (!f) { f = document.createElement('iframe'); f.className = 'preview'; f.setAttribute('sandbox', 'allow-scripts'); block.appendChild(f); }
      f.srcdoc = code.textContent; $('pre', block).hidden = true; f.hidden = false;
      $$('.cb-seg button', block).forEach(x => x.classList.toggle('on', x === btn));
      break;
    }
    case 'code': {
      const f = $('.preview', block); if (f) f.hidden = true;
      $('pre', block).hidden = false;
      $$('.cb-seg button', block).forEach(x => x.classList.toggle('on', x === btn));
      break;
    }
  }
}
async function pageAction(el) {
  const a = el.dataset.pg, id = el.dataset.id;
  switch (a) {
    case 'openConv': selectConv(id); break;
    case 'makeImage': newChat({ noFocus: true }); state.imageMode = true; renderChips(); ta.focus(); break;
    case 'addProject': { const v = await promptDialog({ title: 'پروژه‌ی جدید', label: 'نام پروژه', ok: 'ساخت' }); if (v) { state.projects.unshift({ id: uid(), name: v }); persistExtras(); renderView(); } break; }
    case 'renameProject': { const p = state.projects.find(x => x.id === id); if (!p) break; const v = await promptDialog({ title: 'تغییر نام پروژه', label: 'نام جدید', value: p.name }); if (v) { p.name = v; persistExtras(); renderView(); } break; }
    case 'delProject': { const p = state.projects.find(x => x.id === id); if (!p) break; if (await confirmDialog({ title: 'حذف پروژه؟', text: `«${p.name}» حذف می‌شود.`, ok: 'حذف', danger: true })) { state.projects = state.projects.filter(x => x.id !== id); persistExtras(); renderView(); } break; }
    case 'addTask': taskDialog(); break;
    case 'toggleTask': { const t = state.tasks.find(x => x.id === id); if (t) { t.on = !t.on; persistExtras(); renderView(); } break; }

const planRefresh = () => { if (S.plan.id !== 'free' && Date.now() > S.plan.until) { S.plan = { id: 'free', until: 0 }; saveS(); updateHeader(); } };
const planQuota = () => { planRefresh(); return S.plan.id === 'free' ? 100 : ((CONFIG.PLANS[S.plan.id] || {}).quota || 100); };
const usageLeft = () => { usageRefresh(); return Math.max(0, planQuota() - S.usage.used); };
const usagePct = () => Math.round(usageLeft() / planQuota() * 100);
function spend(cost) {
  if (usageLeft() < cost) { toast('محدودیت استفاده تمام شده است'); if (S.plan.id === 'free') Screens.open('plans'); return false; }
  S.usage.used += cost; saveS();
  if (usagePct() <= 10) notify('usage', 'ChatGPT', 'محدودیت استفاده رو به پایان است', { always: true });
  return true;
}
function toggleDeep() {
  if (!state.deep && usageLeft() < 5) { toast('محدودیت استفاده تمام شده است'); return; }
  state.deep = !state.deep; renderChips(); toast(state.deep ? 'تفکر عمیق‌تر روشن شد' : 'تفکر عمیق‌تر خاموش شد');
}
function autosize() {

}
function updateComposer() {

}

const MEMORY_CMD = /^(?:یادت باشه|یادت بمونه|به یاد داشته باش|به خاطر بسپار)[\s:،]+(.+)/s;
function send(textOverride) {
  const text = (typeof textOverride === 'string' ? textOverride : ta.value).trim();
  if ((!text && !state.attachments.length) || state.generating) return Promise.resolve('');
  let conv = getConv(state.activeId);
  if (!conv) {
    conv = { id: uid(), title: 'چت جدید', temp: state.temp || undefined, messages: [], createdAt: Date.now(), updatedAt: Date.now(), archived: false };
    state.conversations.unshift(conv); state.activeId = conv.id;
  }
  const cost = state.imageMode ? 10 : state.deep ? 5 : 1;
  if (!spend(cost)) return Promise.resolve('');
  const label = text || (state.attachments[0] && state.attachments[0].name) || 'گفتگو';
  if (!conv.messages.length && !conv.temp) conv.title = label.length > 34 ? label.slice(0, 34).trim() + '…' : label;
  conv.messages.push({ id: uid(), role: 'user', content: text, time: Date.now(), attachments: state.attachments.slice() });
  conv.updatedAt = Date.now();
  const mm = text.match(MEMORY_CMD);
  if (mm && S.memory.on && !conv.temp) { S.memory.items.unshift({ id: uid(), text: mm[1].trim(), time: Date.now() }); saveS(); toast('به حافظه اضافه شد'); }
  const deep = state.deep, img = state.imageMode;
  state.attachments = []; state.deep = false; state.imageMode = false; renderChips();
  pruneEmpty(conv.id);
  ta.value = ''; autosize();
  persist(); renderDrawerList();
  return img ? makeImage(conv.id, text) : generate(conv.id, deep);
}
async function generate(convId, deep = false) {
  const conv = getConv(convId); if (!conv) return '';
  const ctrl = new AbortController();
  state.generating = { convId, ctrl, deep }; state.typing = true;
  updateComposer();
  if (state.activeId === convId && state.view === 'chat') renderThread();
  let msg = null;
  try {
    const payload = conv.messages.map(({ role, content, attachments }) => ({ role, content, attachments: (attachments || []).filter(a => a.id) }));
    const onDelta = d => {
      if (!msg) {
        msg = { id: uid(), role: 'assistant', content: '', time: Date.now(), feedback: null };
        state.typing = false; state.streamingId = msg.id; conv.messages.push(msg);
        if (state.activeId === convId && state.view === 'chat') renderThread();
      }
      msg.content += d;
      if (state.activeId === convId && state.view === 'chat') {
        const el = document.getElementById('md-' + msg.id);
        if (el) {
          const near = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 140;
          el.innerHTML = renderMarkdown(msg.content);
          if (near) scroller.scrollTop = scroller.scrollHeight;
        }
      }
    };
    const text = await AIService.stream(payload, { signal: ctrl.signal, deep, onDelta });
    notify('replies', 'ChatGPT', Speech.clean(text).slice(0, 120));
  } catch (err) {
    if (err.name !== 'AbortError') { console.error(err); toast('تولید پاسخ با خطا روبه‌رو شد' + (err.message ? ' — ' + err.message : '')); }
  } finally {
    state.typing = false; state.streamingId = null; state.generating = null;
    if (msg && !msg.content) conv.messages = conv.messages.filter(x => x !== msg);
    conv.updatedAt = Date.now();
    persist(); updateComposer(); renderDrawerList();
    if (state.activeId === convId && state.view === 'chat') renderThread();
  }
  return msg ? msg.content : '';
}
async function makeImage(convId, prompt) {
  const conv = getConv(convId); if (!conv) return '';
  const ctrl = new AbortController();
  state.generating = { convId, ctrl, deep: false }; state.typing = true;
  updateComposer(); if (state.activeId === convId && state.view === 'chat') renderThread();
  try {
    if (!apiReady()) throw new Error('no-api');
    const r = await fetch(apiBase() + '/images/generations', { method: 'POST', signal: ctrl.signal, headers: authHeaders(), body: JSON.stringify({ model: CONFIG.API.imageModel || 'gpt-image-1', prompt, size: '1024x1024', n: 1 }) });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || 'API ' + r.status);
    const d = j.data[0];
    const blob = d.b64_json ? new Blob([Uint8Array.from(atob(d.b64_json), c => c.charCodeAt(0))], { type: 'image/png' }) : await (await fetch(d.url, { signal: ctrl.signal })).blob();
    const id = uid(); await Blobs.add(id, blob);
    conv.messages.push({ id: uid(), role: 'assistant', content: '', time: Date.now(), attachments: [{ id, name: 'image.png', isImage: true, type: blob.type }] });
  } catch (err) {
    if (err.name !== 'AbortError') toast(err.message === 'no-api' ? 'برای ساخت تصویر باید API را تنظیم کنید' : 'ساخت تصویر ناموفق بود');
  } finally {
    state.typing = false; state.generating = null; conv.updatedAt = Date.now();
    persist(); updateComposer(); renderDrawerList();
    if (state.activeId === convId && state.view === 'chat') renderThread();
  }
  return '';
}

/* =====================================================
   Camera (real getUserMedia, falls back to the system camera)
===================================================== */
async function openCamera() {
  if (lockdown()) { toast('حالت قفل فعال است'); return; }
  if (!secure || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('#fileCam').click(); return; }
  const el = document.createElement('div');
  el.className = 'cam';
  el.innerHTML = `<video playsinline autoplay muted></video><div class="cam-msg" id="camMsg" hidden></div><div class="cam-bar"><button class="cam-sec" id="camFlip" aria-label="تعویض دوربین">${icon('flip', 24)}</button><button class="cam-shot" id="camShot" aria-label="عکس گرفتن"></button><button class="cam-sec" id="camClose" aria-label="بستن">${icon('close', 24)}</button></div>`;
  document.body.appendChild(el);
  const video = $('video', el), msg = $('#camMsg', el);
  let stream = null, facing = 'environment';
  const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  const close = () => { stop(); el.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  const start = async () => {
    stop(); msg.hidden = true;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: 1920 } }, audio: false });
      video.srcObject = stream;
      video.style.transform = facing === 'user' ? 'scaleX(-1)' : '';
    } catch (err) {
      msg.hidden = false;
      msg.textContent = err.name === 'NotAllowedError' ? 'اجازه‌ی دسترسی به دوربین داده نشده است. آن را در تنظیمات مرورگر فعال کنید.' : err.name === 'NotFoundError' ? 'دوربینی پیدا نشد.' : 'باز کردن دوربین ممکن نشد.';
    }
  };
  $('#camClose', el).onclick = close;
  $('#camFlip', el).onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start(); };
  $('#camShot', el).onclick = () => {
    if (!stream || !video.videoWidth) return;
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    const ctx = c.getContext('2d');
    if (facing === 'user') { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0);
    c.toBlob(b => { if (!b) return; close(); addFiles([new File([b], `photo-${Date.now()}.jpg`, { type: 'image/jpeg' })]); }, 'image/jpeg', .9);
  };
  start();
}

/* =====================================================

===================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let dictation = null;
function saveDictation(text) {
  const t = text.trim(); if (!t) return;
  const list = LS.get('dict', []); list.unshift({ id: uid(), text: t, time: Date.now() });
  LS.set('dict', list.slice(0, 100));
}
micBtn.addEventListener('click', () => {
  if (!SR) { toast('مرورگر شما از تایپ با صدا پشتیبانی نمی‌کند'); return; }
  if (dictation) { dictation.stop(); return; }
  const base = ta.value;
  const r = new SR(); r.lang = speechLang(); r.interimResults = true;
  let heard = '';
  r.onresult = e => {
    let t = ''; for (const res of e.results) t += res[0].transcript;
    heard = t;

function setVoiceUI(muted, msg, mode) {
