function startVoiceRec() {
  if (!SR) { setVoiceUI(true, 'مرورگر شما از تشخیص گفتار پشتیبانی نمی‌کند.'); return; }
  if (state.generating) return;
  const r = new SR(); r.lang = speechLang(); r.interimResults = true;
  voiceText = ''; setVoiceUI(false, 'در حال گوش دادن…');
  r.onresult = e => { let t = ''; for (const res of e.results) t += res[0].transcript; voiceText = t; if (voiceEl) $('#vStatus').textContent = t; };
  r.onerror = ev => { if (ev.error === 'not-allowed') setVoiceUI(true, 'اجازه‌ی دسترسی به میکروفون داده نشده است.'); };
  r.onend = () => {
    if (voiceRec !== r) return;
    voiceRec = null;
    if (!voiceEl) return;
    if (voiceText.trim()) voiceTurn(voiceText.trim());
    else if (!voiceMuted) { if (S.voice.model === 'live') startVoiceRec(); else setVoiceUI(true, 'چیزی شنیده نشد. روی میکروفون بزنید.'); }
  };

}

  const r = voiceRec; voiceRec = null;
  if (r) { try { r.abort(); } catch {} }

}

  setVoiceUI(false, text, 'think');
  const reply = await send(text);
  if (!voiceEl) return;
  if (!reply) { setVoiceUI(true, 'پاسخی دریافت نشد. روی میکروفون بزنید.'); return; }
  setVoiceUI(false, Speech.clean(reply).slice(0, 220));
  const ok = Speech.speak(reply, { key: 'voice', onend: () => { if (voiceEl && !voiceMuted) { if (S.voice.model === 'live') startVoiceRec(); else setVoiceUI(true, 'روی میکروفون بزنید تا ادامه دهیم.'); } } });
  if (!ok) setVoiceUI(true, 'خواندن با صدا در این مرورگر پشتیبانی نمی‌شود.');
}

      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],

const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes) {

}

async function totpAt(secret, t) {

  const o = h[19] & 15;
  const code = (((h[o] & 0x7f) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3]) % 1e6;

}

/* ---------- Bale Pay (mini-app payments: createInvoiceLink + WebApp.openInvoice) ---------- */
const BalePay = {
  sdk: () => window.Bale && window.Bale.WebApp,
  inBale() { const w = this.sdk(); return !!(w && w.initData); },
  loadSDK() {
    if (this._p) return this._p;
    return (this._p = new Promise(res => {
      if (this.sdk()) return res(true);
      const sc = document.createElement('script');
      sc.src = 'https://tapi.bale.ai/miniapp.js?3'; sc.async = true;
      sc.onload = () => res(!!this.sdk()); sc.onerror = () => res(false);
      document.head.appendChild(sc); setTimeout(() => res(!!this.sdk()), 5000);
    }));
  },
  userId() { const w = this.sdk(); return (w && w.initDataUnsafe && w.initDataUnsafe.user && w.initDataUnsafe.user.id) || (state.user && (state.user.email || state.user.sub)) || 'guest'; },
  async createLink(plan) {
    const cfg = CONFIG.PLANS[plan], B = CONFIG.BALE;
    const payload = `${plan}:${uid()}:${this.userId()}`;
    let link;
    if (B.proxyUrl) {
      const r = await fetch(B.proxyUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ plan, payload, userId: this.userId() }) });
      if (!r.ok) throw new Error('invoice'); link = (await r.json()).link;
    } else {
      const token = secret(B.botToken), prov = secret(B.providerToken);
      if (!token || !prov) throw new Error('no-cfg');
      const r = await fetch(`https://tapi.bale.ai/bot${token}/createInvoiceLink`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: cfg.title, description: cfg.title + ' — ' + cfg.days, payload, provider_token: prov, prices: [{ label: cfg.title, amount: cfg.amount }] }) });
      const j = await r.json(); if (!j.ok) throw new Error('invoice'); link = j.result;
    }
    return { link, payload };
  },
  async buy(plan) {
    if (!(await this.loadSDK()) || !this.inBale()) throw new Error('not-bale');
    const { link, payload } = await this.createLink(plan);
    const status = await new Promise(res => this.sdk().openInvoice(link, st => res(st)));
    return { status, payload };
  }
};
function activatePlan(plan, payload) {
  const cfg = CONFIG.PLANS[plan];
  S.plan = { id: plan, until: Date.now() + cfg.days * 86400000 };
  S.payments.unshift({ plan, payload, amount: cfg.amount, time: Date.now() });
  S.usage.used = 0; saveS(); updateHeader(); renderView();
}
async function buyPlan(plan) {
  toast('در حال آماده‌سازی پرداخت…');
  try {
    const { status, payload } = await BalePay.buy(plan);
    if (status === 'paid') { activatePlan(plan, payload); toast('اشتراک فعال شد'); Screens.refresh(); }
    else if (status === 'pending') toast('پرداخت در انتظار تأیید است');
    else toast('پرداخت انجام نشد');
  } catch (err) {
    if (err.message === 'not-bale') infoDialog('پرداخت با بله', `<p>پرداخت اشتراک از طریق مینی‌اپ بله انجام می‌شود. برنامه را داخل بله باز کنید.</p>${CONFIG.BALE.miniappUrl ? `<p><a class="link" href="${esc(CONFIG.BALE.miniappUrl)}" target="_blank" rel="noopener">باز کردن در بله</a></p>` : ''}`);
    else if (err.message === 'no-cfg') infoDialog('پرداخت با بله', '<p>توکن بازو و توکن پرداخت (provider_token) را در <span dir="ltr">CONFIG.BALE</span> بگذارید.</p>');
    else toast('ساخت فاکتور ناموفق بود');
  }
}
function restorePlan() {
  planRefresh();
  if (S.plan.id !== 'free') { toast('اشتراک شما فعال است'); return; }
  const p = S.payments.find(x => Date.now() < x.time + CONFIG.PLANS[x.plan].days * 86400000);
  if (p) { S.plan = { id: p.plan, until: p.time + CONFIG.PLANS[p.plan].days * 86400000 }; saveS(); updateHeader(); toast('اشتراک بازیابی شد'); Screens.refresh(); }
  else toast('اشتراک فعالی پیدا نشد');
}

   Auth: real Google sign-in (Google Identity Services)
===================================================== */
function setUser(u) {
  state.user = u; LS.set('user', u); LS.del('guest'); LS.set('lastSeen', Date.now());
  renderAvatar();
  const a = $('#auth'); if (a) a.remove();
  toast(`خوش آمدید، ${u.name}`);
}
async function logout(all) {
  const ok = await confirmDialog({ title: all ? 'خروج از همه؟' : 'خروج از حساب؟', text: all ? 'همه‌ی نشست‌ها پایان می‌یابند و از این دستگاه هم خارج می‌شوید.' : 'گفتگوهای ذخیره‌شده در همین دستگاه باقی می‌مانند.', ok: 'خروج', danger: all });
  if (!ok) return false;
  try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch {}
  if (all) { LS.del('sessions'); LS.del('sid'); }
  state.user = null; LS.del('user'); renderAvatar(); toast('از حساب خارج شدید');
  return true;
}
const cid = () => S.googleClientId || CONFIG.GOOGLE_CLIENT_ID;
/* ---------- e-mail accounts: password (PBKDF2) + optional 6-digit code by e-mail ---------- */
const Accounts = {
  all: () => LS.get('accounts', {}),
  save(a) { LS.set('accounts', a); },
  async hash(pw, saltB64) {
    const salt = saltB64 ? unb64(saltB64) : crypto.getRandomValues(new Uint8Array(16));
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, key, 256);
    return { salt: b64(salt), hash: b64(bits) };
  },
  code: null,
  mailReady: () => { const m = CONFIG.EMAILJS; return !!(m.serviceId && m.templateId && m.publicKey); },
  async sendCode(email) {
    const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 900000 + 100000);
    const m = CONFIG.EMAILJS;
    const r = await fetch('https://api.emailjs.com/api/v1.0/email/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service_id: m.serviceId, template_id: m.templateId, user_id: m.publicKey, template_params: { to_email: email, email, code, passcode: code, app_name: 'ChatGPT' } }) });
    if (!r.ok) throw new Error('mail');
    this.code = { email, code, exp: Date.now() + 10 * 60000, tries: 0 };
  },
  check(email, code) {
    const c = this.code; if (!c || c.email !== email || Date.now() > c.exp || ++c.tries > 5) return false;
    return c.code === code;
  }
};
const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function showAuth() {
  if ($('#auth')) return;
  setDrawer(false);
  const el = document.createElement('div');
  el.id = 'auth'; el.className = 'auth';
  document.body.appendChild(el);
  const ctx = { email: '', mode: '' };
  const frame = body => { el.innerHTML = `<button class="circle auth-x" type="button" data-a="${ctx.step === 'email' ? 'skip' : 'back'}" aria-label="بازگشت">${icon(ctx.step === 'email' ? 'close' : 'back')}</button><div class="auth-box">${logoSVG(84)}${body}</div>`; };
  const step = {
    email() {
      ctx.step = 'email';
      frame(`<h1>ورود یا ثبت‌نام</h1><p>برای ذخیره‌ی حساب و دسترسی به همه‌ی امکانات وارد شوید.</p>
        <button class="auth-btn" type="button" data-a="google">${G_SVG}<span>ادامه با Google</span></button>
        <div class="auth-or">یا</div>
        <input class="auth-field" id="aEmail" type="email" dir="ltr" inputmode="email" autocomplete="email" placeholder="آدرس ایمیل" value="${esc(ctx.email)}">
        <p class="auth-err" id="aErr"></p>
        <button class="auth-primary" type="button" data-a="next">ادامه</button>
        <button class="auth-link" type="button" data-a="skip">فعلاً نه</button>`);
      const i = $('#aEmail', el); i.addEventListener('keydown', e => { if (e.key === 'Enter') go('next'); });
    },
    password() {
      ctx.step = 'password';
      const exists = !!Accounts.all()[ctx.email];
      ctx.mode = exists ? 'login' : 'signup';
      frame(`<h1>${exists ? 'خوش برگشتید' : 'ساخت حساب'}</h1><p dir="ltr" style="direction:ltr">${esc(ctx.email)}</p>
        ${exists ? '' : '<input class="auth-field" id="aName" autocomplete="name" placeholder="نام">'}
        <input class="auth-field" id="aPw" type="password" dir="ltr" autocomplete="${exists ? 'current-password' : 'new-password'}" placeholder="رمز عبور${exists ? '' : ' (حداقل ۸ نویسه)'}">
        ${exists ? '' : '<input class="auth-field" id="aPw2" type="password" dir="ltr" autocomplete="new-password" placeholder="تکرار رمز عبور">'}
        <p class="auth-err" id="aErr"></p>
        <button class="auth-primary" type="button" data-a="submit">${exists ? 'ورود' : 'ادامه'}</button>
        ${exists && Accounts.mailReady() ? '<button class="auth-link" type="button" data-a="codeLogin">ورود با کد ایمیل</button>' : ''}`);
      const f = $('#aName', el) || $('#aPw', el); f.focus();
      $$('input', el).forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go('submit'); }));
    },
    async code(purpose) {
      ctx.step = 'code'; ctx.purpose = purpose;
      frame(`<h1>کد تأیید</h1><p>کد شش‌رقمی‌ای که به <span dir="ltr">${esc(ctx.email)}</span> فرستادیم را وارد کنید.</p>
        <input class="auth-field" id="aCode" dir="ltr" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" style="text-align:center;letter-spacing:.35em">
        <p class="auth-err" id="aErr"></p>
        <button class="auth-primary" type="button" data-a="verify">تأیید</button>
        <button class="auth-link" type="button" data-a="resend">ارسال دوباره‌ی کد</button>`);
      $('#aCode', el).focus();
      $('#aCode', el).addEventListener('keydown', e => { if (e.key === 'Enter') go('verify'); });
    },
    async totp() {
      ctx.step = 'totp';
      frame(`<h1>تأیید دومرحله‌ای</h1><p>کد شش‌رقمی اپلیکیشن احراز هویت را وارد کنید.</p>
        <input class="auth-field" id="aCode" dir="ltr" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:.35em">
        <p class="auth-err" id="aErr"></p><button class="auth-primary" type="button" data-a="totpOk">تأیید</button>`);
      $('#aCode', el).focus();
    }
  };
  const err = m => { const e = $('#aErr', el); if (e) e.textContent = m || ''; };
  const busy = on => $$('.auth-primary', el).forEach(b => { b.disabled = on; });
  async function finish(acc) {
    if (S.sec.totp.on && S.sec.totp.secret) { ctx.acc = acc; return step.totp(); }
    setUser({ name: acc.name, email: ctx.email, picture: '', provider: 'email' });
  }
  async function go(a) {
    const v = id => ($('#' + id, el) ? $('#' + id, el).value : '');
    if (a === 'next') {
      const em = v('aEmail').trim().toLowerCase();
      if (!validEmail(em)) return err('آدرس ایمیل درست نیست');
      ctx.email = em; step.password();
    } else if (a === 'submit') {
      if (!crypto.subtle) return err('برای ورود با ایمیل، صفحه را از https یا localhost باز کنید');
      const pw = v('aPw'), acc = Accounts.all()[ctx.email];
      busy(true);
      try {
        if (ctx.mode === 'login') {
          const h = await Accounts.hash(pw, acc.salt);
          if (h.hash !== acc.hash) { err('رمز عبور درست نیست'); return; }
          finish(acc);
        } else {
          const name = v('aName').trim();
          if (!name) return err('نام را وارد کنید');
          if (pw.length < 8) return err('رمز عبور باید حداقل ۸ نویسه باشد');
          if (pw !== v('aPw2')) return err('تکرار رمز عبور یکسان نیست');
          ctx.pending = { name, ...(await Accounts.hash(pw)) };
          if (Accounts.mailReady()) { try { await Accounts.sendCode(ctx.email); } catch { return err('ارسال کد به ایمیل ناموفق بود'); } step.code('signup'); }
          else { const all = Accounts.all(); all[ctx.email] = { ...ctx.pending, created: Date.now(), verified: false }; Accounts.save(all); finish(all[ctx.email]); }
        }
      } finally { busy(false); }
    } else if (a === 'codeLogin' || a === 'resend') {
      busy(true);
      try { await Accounts.sendCode(ctx.email); toast('کد به ایمیل فرستاده شد'); if (a === 'codeLogin') step.code('login'); }
      catch { err('ارسال کد به ایمیل ناموفق بود'); } finally { busy(false); }
    } else if (a === 'verify') {
      if (!Accounts.check(ctx.email, v('aCode').trim())) return err('کد درست نیست یا منقضی شده است');
      const all = Accounts.all();
      if (ctx.purpose === 'signup') all[ctx.email] = { ...ctx.pending, created: Date.now(), verified: true };
      Accounts.save(all); finish(all[ctx.email]);
    } else if (a === 'totpOk') {
      if (await totpVerify(S.sec.totp.secret, v('aCode').trim())) setUser({ name: ctx.acc.name, email: ctx.email, picture: '', provider: 'email' });
      else err('کد درست نیست');
    }
  }
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a;
    if (a === 'skip') { LS.set('guest', true); el.remove(); }
    else if (a === 'back') { ctx.step === 'code' || ctx.step === 'totp' ? step.password() : step.email(); }
    else if (a === 'google') googleLogin();
    else go(a);
  });
  step.email();
}
function loadGIS() {
  return new Promise((res, rej) => {
    if (window.google && google.accounts && google.accounts.oauth2) return res();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
async function askClientId() {
  const v = await promptDialog({
    title: 'شناسه‌ی Google', label: 'OAuth Web Client ID', dir: 'ltr', placeholder: 'xxxx.apps.googleusercontent.com', ok: 'ذخیره و ادامه',
    text: 'ورود Google به یک Client ID نیاز دارد (فقط یک بار). در Google Cloud Console یک OAuth client از نوع Web بسازید و این آدرس را در Authorized JavaScript origins بگذارید: ' + location.origin
  });
  if (!v) return '';
  if (!/^[\w-]+\.apps\.googleusercontent\.com$/.test(v)) { toast('قالب Client ID درست نیست'); return ''; }
  S.googleClientId = v; saveS(); return v;
}
async function googleLogin() {
  let id = cid();
  if (!id) id = await askClientId();
  if (!id) return;
  if (location.protocol === 'file:') {
    infoDialog('اجرای فایل از file://', '<p>ورود Google روی file:// کار نمی‌کند. فایل را از یک آدرس http(s) باز کنید؛ مثلاً در پوشه‌ی فایل این دستور را بزنید:</p><p dir="ltr" style="font-family:var(--mono);font-size:13px">python -m http.server 8000</p><p>سپس <span dir="ltr">http://localhost:8000</span> را در Authorized JavaScript origins ثبت کنید.</p>');
    return;
  }
  try { await loadGIS(); } catch { toast('اتصال به Google برقرار نشد؛ اینترنت را بررسی کنید'); return; }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: id, scope: 'openid email profile',
    callback: async resp => {
      if (resp.error) { toast('ورود لغو شد یا ناموفق بود'); return; }
      try {
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + resp.access_token } });
        if (!r.ok) throw new Error(r.status);
        const u = await r.json();
        setUser({ name: u.name || u.email, email: u.email, picture: u.picture, sub: u.sub, provider: 'google' });
      } catch { toast('دریافت اطلاعات حساب ناموفق بود'); }
    },
    error_callback: () => toast('ورود Google ناموفق بود')
  });
  client.requestAccessToken({ prompt: 'select_account' });
}

  document.body.appendChild(el);

})();
